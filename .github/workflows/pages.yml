name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types:
      - silex-released
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Check out the Silex documentation
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          path: _sources/Silex

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Resolve the latest released Silex version
        id: silex-version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then
            tag=$(gh api repos/Matanek/Silex/releases/latest --jq .tag_name)
            version="${tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Silex release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the static website
        env:
          SILEX_DOCS_ROOT: _sources/Silex/Docs
          SILEX_SOURCE_ROOT: _sources/Silex
          SILEX_VERSION: ${{ steps.silex-version.outputs.version }}
        run: npm run build

      - name: Check generated pages and links
        run: npm run check

      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
