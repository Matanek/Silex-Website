name: Validate and deploy Silex Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      silex_version:
        description: Expected published Silex version (optional for ordinary deployments)
        required: false
        type: string
  repository_dispatch:
    types:
      - ecosystem-content-updated
      - silex-released
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: silex-website-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: staging
      url: https://silex-lang.org/
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_SITE_ROOT: ${{ vars.VPS_SITE_ROOT || '/srv/silex/web' }}

    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Fetch canonical Silex ecosystem content
        run: npm run content:fetch

      - name: Build the immutable documentation snapshot
        run: npm run content:build -- .content/Silex-Documentation .content/Silex-Registry .content/Silex .content/Packages var/content/sources .content/Silex-Extension-VSCode .content/Silex-Release-Notes

      - name: Identify the website and content release
        id: release
        env:
          EXPECTED_SILEX_VERSION: ${{ inputs.silex_version || github.event.client_payload.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SILEX_VERSION" ]]; then
            test "$(cat var/content/silex-version.txt)" = "$EXPECTED_SILEX_VERSION"
          fi
          printf 'DEPLOYED_SILEX_VERSION=%s\n' "$(cat var/content/silex-version.txt)" >> "$GITHUB_ENV"
          content_digest=$(sha256sum var/content/sources/snapshot.json | cut -c1-16)
          release="$GITHUB_SHA-$content_digest"
          printf '%s\n' "$release" > release.txt
          printf 'SILEX_WEB_RELEASE=%s\n' "$release" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] \
            && response=$(curl --fail --silent --show-error --location https://silex-lang.org/) \
            && grep -Fq "Silex Web release: $release" <<< "$response"; then
            echo 'deploy_needed=false' >> "$GITHUB_OUTPUT"
            echo 'Canonical sources and website commit are unchanged; no deployment needed.'
          else
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked PHP dependencies
        if: steps.release.outputs.deploy_needed == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install locked frontend dependencies
        if: steps.release.outputs.deploy_needed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build the Tailwind stylesheet
        if: steps.release.outputs.deploy_needed == 'true'
        run: npm run build

      - name: Validate the website
        if: steps.release.outputs.deploy_needed == 'true'
        run: |
          npm test
          composer validate --strict
          composer audit --locked
          composer check

      - name: Validate deployment configuration
        if: steps.release.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "The VPS deployment secrets must all be configured" >&2
            exit 1
          fi
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_SSH_PORT must be numeric" >&2
            exit 1
          fi
          if [[ ! "$VPS_SITE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_SITE_ROOT must be an absolute path without spaces" >&2
            exit 1
          fi

      - name: Configure the deployment key
        if: steps.release.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate the immutable release
        if: steps.release.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          release="$VPS_SITE_ROOT/releases/$SILEX_WEB_RELEASE"

          if ! ssh -p "$VPS_SSH_PORT" "$target" "test -f '$release/.complete'"; then
            ssh -p "$VPS_SSH_PORT" "$target" "mkdir -p '$release'"
            rsync -az --delete \
              --exclude '/.content/' \
              --exclude '/.git/' \
              --exclude '/.github/' \
              --exclude '/assets/' \
              --exclude '/deploy/' \
              --exclude '/node_modules/' \
              --exclude '/scripts/' \
              -e "ssh -p $VPS_SSH_PORT" \
              ./ "$target:$release/"
            ssh -p "$VPS_SSH_PORT" "$target" \
              "test -f '$release/public/index.php' && touch '$release/.complete'"
          fi

          ssh -p "$VPS_SSH_PORT" "$target" sh -s -- "$VPS_SITE_ROOT" "$SILEX_WEB_RELEASE" <<'REMOTE'
          set -eu
          site_root=$1
          release=$2
          release_root="$site_root/releases/$release"
          test -f "$release_root/.complete"
          next_link="$site_root/.current-$release"
          ln -sfn "$release_root" "$next_link"
          mv -Tf "$next_link" "$site_root/current"
          REMOTE

      - name: Check the public deployment
        if: steps.release.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          wait_for_content() {
            local url=$1
            local expected=$2
            local response

            for attempt in {1..7}; do
              if response=$(curl --fail --show-error --silent --location "$url") \
                && grep -Fq "$expected" <<< "$response"; then
                printf 'Validated %s on attempt %d\n' "$url" "$attempt"
                return 0
              fi

              if (( attempt < 7 )); then
                sleep 2
              fi
            done

            printf 'Expected content was not served by %s after 7 attempts\n' "$url" >&2
            return 1
          }

          wait_for_content \
            https://silex-lang.org/ \
            "Silex Web release: $SILEX_WEB_RELEASE"
          wait_for_content \
            https://silex-lang.org/fr/docs \
            '<h1>Documentation de Silex</h1>'
          wait_for_content \
            https://silex-lang.org/fr/packages \
            'class="package-catalog" data-package-count="'
          wait_for_content \
            https://silex-lang.org/fr/releases \
            '<h1 id="release-notes-title">Ce qui change dans Silex</h1>'
          release_heading="<h2 id=\"release-${DEPLOYED_SILEX_VERSION//./-}\">Silex $DEPLOYED_SILEX_VERSION</h2>"
          wait_for_content https://silex-lang.org/fr/releases "$release_heading"
          wait_for_content https://silex-lang.org/en/releases "$release_heading"
          wait_for_content \
            https://silex.nekmata.com/ \
            "Silex Web release: $SILEX_WEB_RELEASE"
