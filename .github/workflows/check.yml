name: Check website

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Check out the Silex documentation
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          path: _sources/Silex

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Build the website
        env:
          SILEX_DOCS_ROOT: _sources/Silex/Docs
        run: npm run build

      - name: Check generated pages and links
        run: npm run check
